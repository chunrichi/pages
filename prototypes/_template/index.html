<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__TITLE__</title>
  <style>
    :root {
      --paper: #f7f7f3;
      --ink: #101216;
      --ink-2: #50545c;
      --ink-3: #8a8e96;
      --line: #e5e5de;
      --accent: #2d5be3;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
        "Segoe UI", "Microsoft YaHei", sans-serif;
      --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(800px 520px at 78% 10%, rgba(45, 91, 227, 0.1), transparent 62%),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px -36px rgba(16, 18, 22, 0.28);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .tag {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 26px;
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .tag::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1.05;
    }

    p {
      max-width: 34em;
      margin: 22px 0 0;
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1.85;
    }

    code {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--paper);
      font-family: var(--mono);
      font-size: 0.85em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-top: 42px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">New prototype</p>
    <h1>__TITLE__</h1>
    <p>这是 <code>prototypes/__SLUG__/index.html</code> 的模板。把整个目录换成你的原型即可；保持相对路径，展厅会用 iframe 原样装载它。</p>
    <div class="meta"><span>__DATE__</span><span>prototypes/__SLUG__/</span></div>
  </main>
</body>
</html>
