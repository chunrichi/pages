<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAP Super Agent · VSCode 扩展原型</title>
<meta name="description" content="SAP Super Agent VSCode 扩展界面设计：任务箱、需求详情、文档同步、Agents 与 Skills、ChaRM SSO、Copilot 协作。" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/base.css" />
<link rel="stylesheet" href="assets/components.css" />
<link rel="stylesheet" href="assets/vscode.css" />
<script>if(new URLSearchParams(location.search).get("embed")==="1"){document.documentElement.classList.add("embed-mode");}</script>
</head>
<body class="vs-page">

<header class="vs-top">
  <a class="vs-top__brand" href="index.html">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 7.5 12 3l7 4.5v9L12 21l-7-4.5v-9Z" stroke="currentColor" stroke-width="1.6"/><path d="M8.6 10.2c1.9-1.3 4.9-1.3 6.8 0M8.6 13.8c1.9 1.3 4.9 1.3 6.8 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </span>
    <span><b>SAP Super Agent</b><em>VSCode 扩展设计</em></span>
  </a>
  <nav class="vs-viewbar" aria-label="插件视图">
    <button data-view="plan" class="is-active">任务箱</button>
    <button data-view="task">需求详情</button>
    <button data-view="docs">文档同步</button>
    <button data-view="agents">Agents &amp; Skills</button>
    <button data-view="charm">ChaRM &amp; SSO</button>
    <button data-view="chat">Copilot 协作</button>
    <button data-view="sync">同步与冲突</button>
    <button data-view="states">状态与命令</button>
  </nav>
  <div class="vs-top__links">
    <a class="btn btn--sm" href="app.html">Web 工作台</a>
    <a class="btn btn--sm btn--primary" href="index.html">设计总览</a>
  </div>
</header>

<div class="vs-stage">
  <div class="vs-window" id="vs-window">
    <div class="vs-titlebar">
      <div class="vs-traffic"><i></i><i></i><i></i></div>
      <div class="vs-titlebar__title">sap-abap-fin — Visual Studio Code</div>
      <div class="vs-titlebar__right">
        <span class="vs-titlebar__chip">SAP Super Agent</span>
      </div>
    </div>
    <div class="vs-body">
      <div class="vs-activity">
        <button class="vs-act is-active tooltip" data-tip="SAP Super Agent"><span data-icon="sparkles"></span></button>
        <button class="vs-act tooltip" data-tip="资源管理器"><span data-icon="files"></span></button>
        <button class="vs-act tooltip" data-tip="搜索"><span data-icon="search"></span></button>
        <button class="vs-act tooltip" data-tip="源代码管理"><span data-icon="git-branch"></span></button>
        <button class="vs-act tooltip" data-tip="运行与调试"><span data-icon="play-circle"></span></button>
        <button class="vs-act tooltip" data-tip="扩展"><span data-icon="grid"></span></button>
        <span class="vs-activity__grow"></span>
        <button class="vs-act tooltip" data-tip="账户"><span class="avatar" data-tone="ink">周</span></button>
      </div>
      <aside class="vs-sidebar" id="vs-sidebar"></aside>
      <main class="vs-editor">
        <div class="vs-tabs" id="vs-tabs"></div>
        <div class="vs-editor__body" id="vs-editor"></div>
      </main>
    </div>
    <div class="vs-status" id="vs-status"></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="assets/icons.js"></script>
<script>
  window.SA = window.SA || {};
  SA.screens = SA.screens || {};
  SA.data = SA.data || {};
  SA.register = SA.register || function (n, s) { SA.screens[n] = s; };
  SA.toast = function (msg, opts) {
    var stack = document.getElementById("toast-stack");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = window.ic((opts && opts.icon) || "check-circle") + "<span>" + msg + "</span>";
    stack.appendChild(el);
    setTimeout(function () { el.classList.add("is-leaving"); setTimeout(function () { el.remove(); }, 260); }, 2400);
  };
</script>
<script src="assets/vscode.js"></script>
</body>
</html>
